name: Android APK

on:
  push:
    branches: [feature/introdb, master]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: yarn

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      # the runner image ships the Android SDK; Gradle fetches whatever else it needs
      - name: Accept SDK licenses
        run: yes | "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" --licenses > /dev/null || true

      - name: Install dependencies
        run: yarn install --frozen-lockfile

      - name: Lint
        run: yarn lint:check

      - name: Prebuild
        run: npx expo prebuild --clean --platform android

      - name: Gradle cache
        uses: actions/cache@v4
        with:
          path: |
            ~/.gradle/caches
            ~/.gradle/wrapper
          key: gradle-${{ runner.os }}-${{ hashFiles('yarn.lock', 'app.json') }}

      # the prebuilt project signs release builds with the generated debug keystore,
      # which is enough for sideloading onto a TV with adb
      - name: Assemble release
        working-directory: android
        # packaging one APK per ABI runs out of the default Gradle heap; TVs and phones
        # are ARM, so the x86 builds are skipped
        run: >-
          ./gradlew assembleRelease --no-daemon
          -Dorg.gradle.jvmargs="-Xmx6g -XX:MaxMetaspaceSize=1g"
          -PreactNativeArchitectures=armeabi-v7a,arm64-v8a

      - uses: actions/upload-artifact@v4
        with:
          name: lumen-apk
          path: android/app/build/outputs/apk/release/*.apk
